# pnpm workspace: all fixtures share one virtual store; a single
# `pnpm install` from this directory prepares every fixture.
# esbuild's postinstall (a version check) is intentionally not allowed
# to run — the platform binary ships via optionalDependencies.
# (onlyBuiltDependencies: pnpm 10 syntax. A pnpm 11 run once rewrote
# this file with an `allowBuilds` placeholder — pnpm 10 ignores the
# unknown key, but pnpm 11 would parse the literal "set this to true or
# false" as a build-gate value; if pnpm 11 lands here again, use
# `pnpm approve-builds` to write a real value, never leave a placeholder.)
packages:
  - "."
  - "node-esm"
  - "vite"
  - "webpack5"
  - "esbuild"
onlyBuiltDependencies: []
