# pnpm workspace: all fixtures share one virtual store; a single
# `pnpm install` from this directory prepares every fixture.
# esbuild's postinstall (a version check) is intentionally not allowed
# to run — the platform binary ships via optionalDependencies.
packages:
  - "."
  - "node-esm"
  - "vite"
  - "webpack5"
  - "esbuild"
allowBuilds:
  esbuild: false
