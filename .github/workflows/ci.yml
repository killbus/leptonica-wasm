name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Native oracle harness (M4, design §7.2): the correctness anchor is a
  # native leptonica build from the same versions.json pins — a different
  # toolchain than the wasm build, so wasm-vs-oracle agreement cannot be
  # self-confirming. This job also regenerates the golden chains every run
  # (tests/golden/chains.json → goldens/) and uploads them for the ci job's
  # Test step — goldens are never a repo fixture, they are re-derived from
  # the pinned oracle on every CI run.
  native-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 (2026-07-14): https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      # v6.1.0 (2026-06-26): https://github.com/actions/cache/releases/tag/v6.1.0
      # Native deps layer (design 3: native build products get their own
      # cache). Same actions/cache pin as the ci job's cache steps (already
      # researched there). Keyed by dep pins + the native build script
      # itself (configure flags live in build-native.mjs, the same
      # over-approximation the ci job documents for build.mjs). No emsdk
      # dimension: the host toolchain is the ubuntu-24.04 image. The .done
      # marker in the restored tree re-validates [pin, flags] on build, so
      # a stale or poisoned entry re-compiles rather than shipping wrong
      # bytes. tmp/deps is shared with the ci job's deps cache by design:
      # each job restores its own snapshot; the native .done markers live
      # under tmp/build-native/ and the wasm markers under tmp/build/, so
      # the two marker namespaces cannot collide.
      - name: Cache native deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            tmp/deps
            tmp/downloads
            tmp/build-native
          key: native-deps-${{ hashFiles('vendor/versions.json', 'scripts/build-native.mjs') }}

      # Host cmake/ninja (ubuntu-24.04 preinstalled) build the four pinned
      # deps natively — no emsdk involved, no toolchain cache to verify.
      - name: Build native oracle
        run: node scripts/build-native.mjs --jobs 4

      # Golden generation: same deterministic RGBA input (generate-rgba.mjs
      # has no RNG) replayed through the native oracle. The goldens/ dir is
      # gitignored — CI is its only producer.
      - name: Generate goldens
        run: node scripts/run-oracle.mjs tmp/build-native/oracle/oracle

      # Sanity: every chain must have produced exactly one png and one json
      # (the artifact must be outputs-only — run 33918364134's first wiring
      # let .chain.json inputs into goldens/ and this check caught the
      # 2x json count before it could confuse the comparison step).
      - name: Verify golden artifact count
        run: |
          n=$(ls tests/golden/goldens | grep -c '\.png$' || true)
          m=$(ls tests/golden/goldens | grep -c '\.json$' || true)
          t=$(ls tests/golden/goldens | wc -l)
          c=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('tests/golden/chains.json','utf8')).length))")
          echo "goldens: $t files ($n png / $m json) / $c chains"
          test "$n" -eq "$c" && test "$m" -eq "$c" && test "$t" -eq "$((c * 2))"

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goldens
          path: tests/golden/goldens
          if-no-files-found: error

  ci:
    # The golden suite (inside Test below) compares against goldens the
    # native-oracle job produces this run — never a repo fixture, so the
    # comparison is always anchored to this commit's pinned oracle.
    needs: native-oracle
    # Pinned image: ubuntu-latest is a moving target (monthly image rolls,
    # preinstalled toolchain changes unannounced) — M1 review supply N4.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 (2026-07-14): https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Install dependencies and typecheck
        run: |
          # --ignore-scripts: defense-in-depth against install-script supply
          # chain vectors (M0 review F14; M1 review supply N1 pulled this
          # forward). Verified safe for this tree: the only lockfile package
          # with a hasInstallScript is fsevents (darwin-only, skipped on
          # Linux); vitest's toolchain uses prebuilt rolldown napi bindings,
          # no postinstall required.
          # pnpm migration (2026-09-05, user direction): the repo moved
          # from npm to pnpm — packageManager pin + pnpm-lock.yaml.
          # Corepack reads the pin; pnpm 10.34.5 is the latest 10.x
          # (npm registry, 2026-09-05) with Node >=18.12 engines —
          # pnpm 11 needs Node >=22.13 (node:sqlite) and crashes on
          # the Node 20 CI runner (run 33939367655).
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck

      # Toolchain pins are read from vendor/versions.json (single source of
      # truth — M1 review build-eng W2: size-spike.yml hardcoded the emsdk
      # commit while claiming it came from versions.json).
      - name: Resolve toolchain pins
        id: pins
        run: |
          node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync } from "node:fs";
          const v = JSON.parse(readFileSync("vendor/versions.json", "utf8"));
          const out = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          out("emsdk_commit", v.emsdk.commit);
          out("sdk_version", v.emsdk.sdkVersion);
          out("cmake_tool", v.emsdk.cmakeTool);
          out("ninja_tool", v.emsdk.ninjaTool);
          // actions/cache keys may not contain commas — hash the pin array
          // rather than joining it (run 33844970673: Key Validation Error on
          // the joined form).
          out("deps_hash", createHash("sha256").update([
            v.zlib.commit, v.libpng.commit, v["libjpeg-turbo"].commit, v.leptonica.commit,
          ].join("\n")).digest("hex").slice(0, 16));
          '

      # v6.1.0 (2026-06-26): https://github.com/actions/cache/releases/tag/v6.1.0
      # emsdk layer (design §3: "emsdk 按精确版本键"), keyed by the full
      # toolchain identity from versions.json. Content re-verification: the
      # reproducibility job below cold-installs the toolchain every run, so
      # an emsdk cache that alters artifacts diverges the compare job's
      # hashes and fails loudly.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tmp/emsdk
          key: emsdk-${{ steps.pins.outputs.emsdk_commit }}-${{ steps.pins.outputs.sdk_version }}-${{ steps.pins.outputs.cmake_tool }}-${{ steps.pins.outputs.ninja_tool }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tmp/emsdk
          git -C tmp/emsdk fetch --depth 1 origin ${{ steps.pins.outputs.emsdk_commit }}
          git -C tmp/emsdk checkout ${{ steps.pins.outputs.emsdk_commit }}
          # EMSDK_KEEP_DOWNLOADS=1: the pinned emsdk.py deletes archives after
          # install by default — keep them so verify-toolchain.mjs can hash
          # them (M1 review supply W1: ~430MB of toolchain archives have no
          # content verification anywhere else; a failed verify fails this
          # job, and actions/cache only saves on job success, so a poisoned
          # archive never enters the cache layer).
          EMSDK_KEEP_DOWNLOADS=1 ./tmp/emsdk/emsdk install ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}
          ./tmp/emsdk/emsdk activate ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}
          node scripts/verify-toolchain.mjs
          # Drop the archives before the emsdk cache layer saves this tree —
          # they re-verify only on cold installs (this step), never on
          # cache hits; keeping them would bloat the cache by ~430MB.
          rm -rf tmp/emsdk/downloads

      # v6.1.0 (2026-06-26): https://github.com/actions/cache/releases/tag/v6.1.0
      # Cache layers (design §3): deps sources + static libs keyed by dep
      # pins AND toolchain AND the build script. build.mjs's hashFiles key is
      # an over-approximation of the configure-flags hash (depConfigs lives
      # in build.mjs, so any flag edit changes the file) — conservative but
      # correct; hashing the flags in isolation would need depConfigs
      # importable without executing the script's main body.
      # Toolchain in the key is design §3 ("versions.json + 工具链哈希"):
      # an emsdk bump with unchanged dep pins must not reuse .a files
      # compiled by the old emcc. The .done marker inside the restored tree
      # re-validates [pin, flags, toolchain] on build, and the compare job's
      # hash equality against an independent cold build re-verifies cache
      # content (supply N3: the cache layer is otherwise a bypass around
      # fetch verification) — a poisoned cache fails loudly, not silently.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            tmp/deps
            tmp/build
            tmp/downloads
          key: deps-${{ steps.pins.outputs.deps_hash }}-${{ steps.pins.outputs.emsdk_commit }}-${{ hashFiles('scripts/build.mjs') }}

      - name: Build (default)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs
          cp dist/build-report.json tmp/report-default.json

      - name: Build (default at -O2, same-opt-level control)
        # M1 review perf topic 1: the M1 size comparison mixed -O2 (full-abi)
        # vs -O3 (default). This control build reuses the compiled deps
        # (~6s link) and isolates the optimization-level variable so the
        # full-abi vs default delta can be stated at a single opt level.
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs --opt O2 --outdir dist-o2
          node --input-type=commonjs -e 'const fs = require("fs");
          const d = JSON.parse(fs.readFileSync("tmp/report-default.json", "utf8"));
          const o2 = JSON.parse(fs.readFileSync("dist-o2/build-report.json", "utf8"));
          console.log(`default@-O3: wasm ${d.wasmBytes} / gzip ${d.wasmGzipBytes}`);
          console.log(`default@-O2: wasm ${o2.wasmBytes} / gzip ${o2.wasmGzipBytes}`);'

      - name: Check exports (default)
        run: node scripts/check-exports.mjs dist

      # M4 review W11: the hand-pinned CuratedModule interface vs the live
      # embind module — catches bindings-side renames the d.ts never sees.
      - name: Check curated methods (default)
        run: node scripts/check-exports.mjs --curated-methods dist

      - name: Smoke test (default)
        run: node scripts/smoke.mjs dist

      - name: Build (full ABI)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs --full-abi

      - name: Check exports (full ABI)
        run: node scripts/check-exports.mjs --full-abi dist/full-abi

      - name: Smoke test (full ABI)
        run: node scripts/smoke.mjs --full-abi dist/full-abi

      # v8.0.1 (2026-03-11): https://github.com/actions/download-artifact/releases/tag/v8.0.1
      # Goldens from the native-oracle job land in tests/golden/goldens/
      # (gitignored — CI regenerated, never a repo fixture). The golden
      # suite below replays the same chains through the wasm bindings and
      # compares against these files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: goldens
          path: tests/golden/goldens

      # Guard: the golden suite must actually run — a missing goldens dir
      # would turn it into a vacuous skip (same posture as the full-abi
      # guard above, M3 review lesson).
      - name: Goldens present
        run: test -f tests/golden/goldens/queries-findSkew-countPixels.json

      # pnpm test runs AFTER the full-abi build: the raw-layer unit tests
      # instantiate dist/full-abi artifacts (M3). Dev machines have no build
      # (zero-build discipline) and skip without them — but CI must run the
      # full suite, so fail loudly if the artifact is missing here rather
      # than letting describe.skipIf turn this step vacuously green.
      - name: Test
        run: |
          test -f dist/full-abi/leptonica.wasm
          pnpm test

      # Mutation smoke (M2 review F5): prove the golden suite catches a
      # broken parameter mapping — mutate threshold's level (+1), require
      # the suite to go red, restore, require green. Runs after the main
      # Test step with the same goldens/ dir still in place.
      - name: Mutation smoke
        run: node scripts/mutation-smoke.mjs

      # Consumer fixture (M0 review F16): compile the package's types
      # from a consuming project with skipLibCheck:false — the posture
      # the package's own typecheck (skipLibCheck:true) cannot prove.
      # arethetypeswrong then checks the export map resolves for every
      # consumption style (node10 resolution is expected to fail for an
      # ESM-only package; that failure is in the allowlist).
      # M4 review B2: the check also RUNS main.ts — the runtime import
      # path (dist/types/*.js) was once broken while everything above
      # stayed green.
      - name: Consumer fixture
        run: |
          node scripts/gen-types.mjs
          cd tests/consumer
          pnpm install --frozen-lockfile
          pnpm run check

      # Bundler matrix (M5): the shared fixture entry must build/load
      # from every consumption style — vite/webpack5/esbuild bundles plus
      # plain Node ESM. The fixtures are pnpm-managed (npm's file:
      # symlink handling mangles nested layouts; see
      # scripts/check-bundler-matrix.mjs). The whole repo is pnpm now
      # (2026-09-05, user direction) - the fixtures workspace pins
      # the same pnpm 10.34.5 via its packageManager field.
      - name: Bundler matrix
        run: node scripts/check-bundler-matrix.mjs

      # Playwright E2E (M6): the browser worker session must produce
      # byte-identical PNG output to the Node worker session — the same
      # session API, same chain, different platform stack. Chromium is
      # installed per-run (no cache layer for browser binaries — the
      # download is ~2min and keeps the runner stateless).
      - name: E2E (browser vs Node, byte-identical)
        run: |
          # chromium-headless-shell listed explicitly: 1.63's headless mode
          # uses the separate headless-shell binary; "chromium" alone did
          # not pull it in local testing, leaving the suite to fail on a
          # missing browser.
          pnpm exec playwright install --with-deps chromium chromium-headless-shell
          pnpm exec playwright test

      - name: Determinism check (same runner)
        # Relink from the same .a files and compare all four artifacts —
        # the .mjs/.d.ts/.symbols companions are hashed too (M1 review
        # build-eng W3: wasm-only comparison left the JS glue unverified).
        # Compile determinism is proven by the reproducibility job below
        # (independent cold build, cross-runner), so this step rebuilds
        # links only: dist/full-abi is left intact (only the four default
        # files are removed and relinked).
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          mkdir -p tmp/first
          cp dist/leptonica.wasm dist/leptonica.mjs dist/leptonica.d.ts dist/leptonica.mjs.symbols tmp/first/
          rm -f dist/leptonica.wasm dist/leptonica.mjs dist/leptonica.d.ts dist/leptonica.mjs.symbols dist/build-report.json
          node scripts/build.mjs
          node --input-type=commonjs <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const sha = (p) => crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
          for (const f of ["leptonica.wasm", "leptonica.mjs", "leptonica.d.ts", "leptonica.mjs.symbols"]) {
            const a = sha(`tmp/first/${f}`);
            const b = sha(`dist/${f}`);
            if (a !== b) {
              console.error(`hash mismatch for ${f}: ${a} != ${b}`);
              process.exit(1);
            }
          }
          console.log("all four artifacts reproducible (wasm, mjs, d.ts, symbols)");
          NODE

      # dist sha256 manifest (M0 review F7 / M6): generated after all
      # builds and relinks so it covers the final dist/ tree (default
      # + full-abi), then uploaded with ci-dist. The compare job below
      # proves ci-dist and repro-dist byte-identical across runners, so
      # the manifest that ships with ci-dist is proven to describe the
      # independently compiled tree too.
      - name: Generate dist sha256 manifest
        run: pnpm run hash-manifest

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-dist
          path: dist
          if-no-files-found: warn

  # Cross-runner compile determinism (M1 review supply W3 + build-eng W3):
  # an independent cold build on a different runner instance — no cache
  # restore, so the .a files come from this job's own compile. The compare
  # job below hashes it against the ci job's output. This is also the
  # cache-content re-verification (supply N3): on warm-cache runs, ci's
  # artifacts derive from cached .a files while this job compiles from
  # source; hash equality proves the cache content was genuine.
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 (2026-07-14): https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Resolve toolchain pins
        id: pins
        run: |
          node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs";
          const v = JSON.parse(readFileSync("vendor/versions.json", "utf8"));
          const out = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          out("emsdk_commit", v.emsdk.commit);
          out("sdk_version", v.emsdk.sdkVersion);
          out("cmake_tool", v.emsdk.cmakeTool);
          out("ninja_tool", v.emsdk.ninjaTool);
          '

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tmp/emsdk
          git -C tmp/emsdk fetch --depth 1 origin ${{ steps.pins.outputs.emsdk_commit }}
          git -C tmp/emsdk checkout ${{ steps.pins.outputs.emsdk_commit }}
          # Same supply W1 posture as the ci job's cold-install step: this
          # job is also the cache-content re-verification (supply N3) — it
          # must not itself run on unverified toolchain bytes. No cache is
          # saved here, so no downloads cleanup is needed after verify.
          EMSDK_KEEP_DOWNLOADS=1 ./tmp/emsdk/emsdk install ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}
          ./tmp/emsdk/emsdk activate ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}
          node scripts/verify-toolchain.mjs

      - name: Build (default, cold)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repro-dist
          path: |
            dist/leptonica.wasm
            dist/leptonica.mjs
            dist/leptonica.d.ts
            dist/leptonica.mjs.symbols
          if-no-files-found: error

  # Hash comparison of the two builds above: ci (warm or cold) vs
  # reproducibility (always cold). Any byte difference in any of the four
  # artifacts fails the pipeline.
  compare:
    needs: [ci, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # v8.0.1 (2026-03-11): https://github.com/actions/download-artifact/releases/tag/v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Compare artifact hashes
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const sha = (p) => crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
          const files = ["leptonica.wasm", "leptonica.mjs", "leptonica.d.ts", "leptonica.mjs.symbols"];
          for (const f of files) {
            const a = sha(`artifacts/ci-dist/${f}`);
            const b = sha(`artifacts/repro-dist/${f}`);
            if (a !== b) {
              console.error(`cross-runner hash mismatch for ${f}: ${a} != ${b}`);
              process.exit(1);
            }
          }
          console.log(`cross-runner determinism OK (${files.length} artifacts byte-identical)`);
          NODE

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      # dist sha256 manifest (M0 review F7 / M6): same pins, two
      # independently compiled trees — if the manifest is generated from
      # both and the two artifacts are byte-identical (asserted above),
      # the published manifest is proven to describe the other tree too.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-sha256-manifest
          path: artifacts/ci-dist/sha256.json
          if-no-files-found: error
