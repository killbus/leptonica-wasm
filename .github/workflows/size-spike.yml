name: size-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 (2026-07-14): https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Test
        run: |
          # --ignore-scripts: see ci.yml Test step (verified safe for this
          # tree — only lockfile package with an install script is
          # darwin-only fsevents).
          npm ci --ignore-scripts
          npm test
          npm run typecheck

      # Toolchain pins (sdk + cmake + ninja) come from vendor/versions.json —
      # actually injected now, not hardcoded (M1 review build-eng W2: the
      # comment previously claimed versions.json sourcing while the values
      # were a yml-side dual-write).
      - name: Resolve toolchain pins
        id: pins
        run: |
          node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs";
          const v = JSON.parse(readFileSync("vendor/versions.json", "utf8"));
          const out = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          out("emsdk_commit", v.emsdk.commit);
          out("sdk_version", v.emsdk.sdkVersion);
          out("cmake_tool", v.emsdk.cmakeTool);
          out("ninja_tool", v.emsdk.ninjaTool);
          '

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tmp/emsdk
          git -C tmp/emsdk fetch --depth 1 origin ${{ steps.pins.outputs.emsdk_commit }}
          git -C tmp/emsdk checkout ${{ steps.pins.outputs.emsdk_commit }}
          ./tmp/emsdk/emsdk install ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}
          ./tmp/emsdk/emsdk activate ${{ steps.pins.outputs.sdk_version }} ${{ steps.pins.outputs.cmake_tool }} ${{ steps.pins.outputs.ninja_tool }}

      - name: Build (default, cold)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs
          cp dist/build-report.json tmp/report-cold.json

      - name: Build (default, warm)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          rm -rf dist tmp/build
          node scripts/build.mjs
          node --input-type=commonjs -e 'const fs = require("fs");
          const cold = JSON.parse(fs.readFileSync("tmp/report-cold.json", "utf8"));
          const warm = JSON.parse(fs.readFileSync("dist/build-report.json", "utf8"));
          if (cold.wasmSha256 !== warm.wasmSha256) {
            console.error(`wasm sha256 mismatch: cold=${cold.wasmSha256} warm=${warm.wasmSha256}`);
            process.exit(1);
          }
          console.log(`wasm sha256 stable: ${warm.wasmSha256}`);'

      - name: Check exports (default)
        run: node scripts/check-exports.mjs dist

      - name: Smoke test (default)
        run: node scripts/smoke.mjs dist

      - name: Build (full ABI)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs --full-abi --outdir dist/full-abi

      - name: Check exports (full ABI)
        run: node scripts/check-exports.mjs --full-abi dist/full-abi

      - name: Smoke test (full ABI)
        run: node scripts/smoke.mjs --full-abi dist/full-abi

      - name: Write step summary
        if: always()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("fs");
          const lines = [
            "| mode | wasm bytes | wasm gzip bytes | js bytes | wall (s) |",
            "| --- | ---: | ---: | ---: | ---: |",
          ];
          function add(label, path) {
            try {
              const r = JSON.parse(fs.readFileSync(path, "utf8"));
              lines.push(`| ${label} | ${r.wasmBytes} | ${r.wasmGzipBytes} | ${r.jsBytes} | ${(r.wallMs / 1000).toFixed(1)} |`);
              lines.push(`- wasm sha256: \`${r.wasmSha256}\``);
            } catch {}
          }
          add("default (cold)", "tmp/report-cold.json");
          add("full-abi", "dist/full-abi/build-report.json");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: size-spike-dist
          path: dist
          if-no-files-found: warn
