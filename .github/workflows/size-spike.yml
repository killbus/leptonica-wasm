name: size-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0 (2026-07-14): https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Test
        run: |
          npm ci
          npm test
          npm run typecheck

      # Toolchain pins (sdk + cmake + ninja) come from vendor/versions.json.
      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tmp/emsdk
          git -C tmp/emsdk fetch --depth 1 origin 5eb0bde7585670252e8ba05e9d361627bffd08b5
          git -C tmp/emsdk checkout 5eb0bde7585670252e8ba05e9d361627bffd08b5
          ./tmp/emsdk/emsdk install 6.0.9 cmake-4.2.0-rc3-64bit ninja-1.13.2-64bit
          ./tmp/emsdk/emsdk activate 6.0.9 cmake-4.2.0-rc3-64bit ninja-1.13.2-64bit

      - name: Build (default, cold)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs
          cp dist/build-report.json tmp/report-cold.json

      - name: Build (default, warm)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          rm -rf dist tmp/build
          node scripts/build.mjs
          node --input-type=commonjs -e 'const fs = require("fs");
          const cold = JSON.parse(fs.readFileSync("tmp/report-cold.json", "utf8"));
          const warm = JSON.parse(fs.readFileSync("dist/build-report.json", "utf8"));
          if (cold.wasmSha256 !== warm.wasmSha256) {
            console.error(`wasm sha256 mismatch: cold=${cold.wasmSha256} warm=${warm.wasmSha256}`);
            process.exit(1);
          }
          console.log(`wasm sha256 stable: ${warm.wasmSha256}`);'

      - name: Smoke test (default)
        run: node scripts/smoke.mjs dist

      - name: Build (full ABI)
        run: |
          . ./tmp/emsdk/emsdk_env.sh
          node scripts/build.mjs --full-abi --outdir dist/full-abi

      - name: Smoke test (full ABI)
        run: node scripts/smoke.mjs --full-abi dist/full-abi

      - name: Write step summary
        if: always()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("fs");
          const lines = [
            "| mode | wasm bytes | wasm gzip bytes | js bytes | wall (s) |",
            "| --- | ---: | ---: | ---: | ---: |",
          ];
          function add(label, path) {
            try {
              const r = JSON.parse(fs.readFileSync(path, "utf8"));
              lines.push(`| ${label} | ${r.wasmBytes} | ${r.wasmGzipBytes} | ${r.jsBytes} | ${(r.wallMs / 1000).toFixed(1)} |`);
              lines.push(`- wasm sha256: \`${r.wasmSha256}\``);
            } catch {}
          }
          add("default (cold)", "tmp/report-cold.json");
          add("full-abi", "dist/full-abi/build-report.json");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

      # v7.0.1 (2026-04-10): https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: size-spike-dist
          path: dist
          if-no-files-found: warn
