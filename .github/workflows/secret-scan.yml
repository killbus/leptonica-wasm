name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily (M1 review supply N5: committed secret-pattern scanning; the
    # schedule also catches secrets in history that predate the scan's
    # introduction — PR/push triggers only see new diffs). 04:07 UTC, off the
    # top of the hour.
    - cron: "7 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7.0.1 (2026-07-20): https://github.com/actions/checkout/releases/tag/v7.0.1
      # fetch-depth: 0 — full history: gitleaks scans all commits, not just
      # the new diff (gitleaks-action README).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # v3.0.0 (2026-05-30): https://github.com/gitleaks/gitleaks-action/releases/tag/v3.0.0
      # Node 24 runtime (v2's Node 20 leaves the runner platform Sept 2026).
      # Version pinning via GITLEAKS_VERSION env (no `with:` inputs exist):
      # 8.30.1 = gitleaks v8.30.1 (2026-03-21), so scans are reproducible
      # rather than tracking the action's bundled default.
      # Personal repo — no GITLEAKS_LICENSE needed (orgs only).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
